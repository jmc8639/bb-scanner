name: Daily Scan

# Runs every weekday at 22:00 UTC (~5pm ET / 6pm ET depending on DST)
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

# Cancel any in-progress runs when a new one is queued (avoids overlap)
concurrency:
  group: daily-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # 2-hour hard cap; typical run is 30-60 min

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the scanner
        run: python scanner.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Daily scan report $(date -u +%Y-%m-%d)"
          git push
